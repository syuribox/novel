<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コミック | 留学生は同棲JKエルフちゃん</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --sakura: #fda4af;
      --sky: #fda4af;
      --gold: #fbbf24;
      --border: rgba(253, 164, 175, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    a {
      color: var(--sakura);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--gold);
    }

    .container {
      max-width: 1100px; /* 漫画用に幅を拡大 */
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      color: var(--gold);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 0.5rem;
      background: rgba(253, 164, 175, 0.12);
      border: 1px solid var(--border);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--sakura);
    }

    .back-link:hover {
      background: rgba(253, 164, 175, 0.2);
      color: var(--gold);
    }

    h2 {
      font-size: 1.15rem;
      color: var(--gold);
      margin: 2.2rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .work-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0c1222;
      padding: 0.4rem;
    }

    .work-card img {
      max-width: 100%;
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    .work-info {
      padding: 1.3rem 1.5rem 1.5rem;
    }

    .work-info h3 {
      font-size: 1.15rem;
      margin-bottom: 0.6rem;
      color: var(--gold);
    }

    .work-info p {
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    p.nickname {
      color: var(--sakura);
      font-size: 0.88rem;
      margin-bottom: 0.6rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* スマホ：画面幅ぎりぎりまで拡大 */
    @media (max-width: 768px) {
      body {
        padding: 1rem 0 2rem;
      }

      .container {
        max-width: 100%;
        padding: 0 0.25rem;
      }

      header {
        margin-bottom: 1rem;
        padding: 0 0.5rem;
      }

      h1 {
        font-size: 1.4rem;
      }

      .work-card {
        border-radius: 8px;
        border-left: none;
        border-right: none;
        margin-bottom: 0.8rem;
      }

      .cover-wrap {
        padding: 0.15rem 0;
        background: #0c1222;
      }

      .work-card img {
        width: 100%;
        max-width: 100%;
        border-radius: 0;
      }

      footer {
        margin-top: 1.5rem;
        padding: 0 0.5rem;
      }
    }

    /* さらに狭い画面（縦長スマホ） */
    @media (max-width: 480px) {
      body {
        padding: 0.8rem 0 1.5rem;
      }

      .container {
        padding: 0;
      }

      .cover-wrap {
        padding: 0;
      }

      .work-card {
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>コミック</h1>
      <p class="author" style="color:var(--text-muted); font-size:0.9rem; margin-bottom:0.8rem;">留学生は同棲JKエルフちゃん</p>
      <a href="index.html" class="back-link">戻る</a>
    </header>

    <div class="work-card">
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_1.png" alt="コミック1">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_2.png" alt="コミック2">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_3.png" alt="コミック3">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_4.png" alt="コミック4">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_5.png" alt="コミック5">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_6.png" alt="コミック6">
      </div>
      <div class="cover-wrap">
        <img src="comic/jk_elf_comic_7.png" alt="コミック7">
      </div>
    </div>

    <footer>
      <a href="index.html" class="back-link">戻る</a>
      <p>© 2026 takigawa ebiro</p>
    </footer>
  </div>
</body>
</html>
