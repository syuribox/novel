<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギャラリー | 異世界転生スラム街からの成り上がり</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --sakura: #fda4af;
      --sky: #fda4af;
      --gold: #fbbf24;
      --border: rgba(253, 164, 175, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      min-height: 100vh;
      padding: 3rem 1rem 4rem;
    }
    body.ruby-off rt {
      display: none;
    }
    #toggle-ruby {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.3rem 0.5rem;
      z-index: 10;
    }

    a {
      color: var(--sakura);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--gold);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: var(--gold);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 0.5rem;
      background: rgba(253, 164, 175, 0.12);
      border: 1px solid var(--border);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--sakura);
    }

    .back-link:hover {
      background: rgba(253, 164, 175, 0.2);
      color: var(--gold);
    }

    h2 {
      font-size: 1.15rem;
      color: var(--gold);
      margin: 2.2rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .work-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .work-card:hover {
      transform: translateY(-2px);
      border-color: rgba(253, 164, 175, 0.4);
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0c1222;
      padding: 1.2rem;
    }

    .work-card img {
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 6px;
    }

    .work-info {
      padding: 1.3rem 1.5rem 1.5rem;
    }

    .work-info h3 {
      font-size: 1.15rem;
      margin-bottom: 0.6rem;
      color: var(--gold);
    }

    .work-info p {
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    p.nickname {
      color: var(--sakura);
      font-size: 0.88rem;
      margin-bottom: 0.6rem;
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.45rem; }
      body { padding: 2rem 0.8rem 3rem; }
      .work-card img { max-height: 340px; }
    }
  </style>
</head>
<body class="ruby-off">
  <div class="container">
    <button type="button" id="toggle-ruby">ルビON/OFF</button>
    <script src="ruby_button.js" charset="utf-8"></script>
    <header>
      <h1>ギャラリー</h1>
      <p class="author" style="color:var(--text-muted); font-size:0.9rem; margin-bottom:0.8rem;">
        <ruby>異世界<rt>いせかい</rt></ruby><ruby>転生<rt>てんせい</rt></ruby>スラム<ruby>街<rt>がい</rt></ruby>からの<ruby>成<rt>な</rt></ruby>り<ruby>上<rt>あ</rt></ruby>がり
      </p>
      <a href="index.html" class="back-link"><ruby>戻<rt>もど</rt></ruby>る</a>
    </header>

    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_edo.jpg">
      </div>
      <div class="work-info">
        <p>エド</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_minya.jpg">
      </div>
      <div class="work-info">
        <p>ミーニャ</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_rania.jpg">
      </div>
      <div class="work-info">
        <p>ラニア</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_eleanor.jpg">
      </div>
      <div class="work-info">
        <p>エレノア</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_ciel.jpg">
      </div>
      <div class="work-info">
        <p>シエル</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/map_small.jpg">
      </div>
      <div class="work-info">
        <p><ruby>周辺<rt>しゅうへん</rt></ruby>マップ</p>
      </div>
    </div>
    <div class="work-card">
      <div class="cover-wrap">
        <img src="images/slum_10mpv.jpg">
      </div>
      <div class="work-info">
        <p>10,000,000 PV</p>
      </div>
    </div>
    <footer>
      <a href="index.html" class="back-link"><ruby>戻<rt>もど</rt></ruby>る</a>
      <p>© 2026 takigawa ebiro</p>
    </footer>
  </div>
</body>
</html>
